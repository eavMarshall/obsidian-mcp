[package]
name = "obsidian-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
anyhow = "1.0"
walkdir = "2.3"
pulldown-cmark = "0.10"
tokio = { version = "1.0", features = ["full"] }
regex = "1.10"

[dev-dependencies]
tempfile = "3.8"
